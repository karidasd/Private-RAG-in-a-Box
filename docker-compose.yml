version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_engine
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama

  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama_model_puller
    environment:
      - OLLAMA_HOST=ollama:11434
    command: >
      sh -c "sleep 5 && ollama pull nomic-embed-text && ollama pull llama3"
    depends_on:
      - ollama

  backend:
    build:
      context: ./backend
    container_name: rag_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data/chroma_db:/app/data/chroma_db
    environment:
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama

  frontend:
    build:
      context: ./frontend
    container_name: rag_frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
